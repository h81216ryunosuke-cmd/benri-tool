<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8338307154413289" crossorigin="anonymous"></script>

<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="/">べんりツール</a>
    <nav class="site-header__nav">
      <a href="/tools/">ツール一覧</a>
      <a href="/about.html">このサイトについて</a>
      <a href="/contact.html">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>
  <p class="breadcrumb"><a href="/">ホーム</a> &gt; <a href="/tools/">ツール一覧</a> &gt; 文字数カウント</p>
  <h1>文字数カウント</h1>
  <p class="lead">テキストを入力すると、文字数・バイト数・行数・単語数を自動で集計します。</p>

  <div class="card">
    <div class="field">
      <label for="count-text">テキスト</label>
      <textarea id="count-text" style="min-height:220px" placeholder="ここにテキストを入力してください"></textarea>
    </div>
    <div id="count-result" class="result-box">
      <span class="big" id="count-chars">0</span> 文字
    </div>
    <table class="simple-table" style="margin-top:14px">
      <tr><th>文字数（空白・改行を含む）</th><td id="count-chars-all">0</td></tr>
      <tr><th>文字数（空白・改行を除く）</th><td id="count-chars-nospace">0</td></tr>
      <tr><th>バイト数（UTF-8）</th><td id="count-bytes">0</td></tr>
      <tr><th>行数</th><td id="count-lines">0</td></tr>
      <tr><th>単語数（半角スペース区切り）</th><td id="count-words">0</td></tr>
    </table>
  </div>

  <div class="ad-slot">広告枠（AdSense承認後に設置）</div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>&copy; 2026 べんりツール</span>
    <div class="site-footer__links">
      <a href="/about.html">このサイトについて</a>

      <a href="/contact.html">お問い合わせ</a>
    </div>
  </div>
</footer>

<script>
var textarea = document.getElementById('count-text');

function update() {
  var text = textarea.value;
  var noSpace = text.replace(/\s/g, '');
  var bytes = new TextEncoder().encode(text).length;
  var lines = text === '' ? 0 : text.split(/\n/).length;
  var words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

  document.getElementById('count-chars').textContent = text.length.toLocaleString();
  document.getElementById('count-chars-all').textContent = text.length.toLocaleString();
  document.getElementById('count-chars-nospace').textContent = noSpace.length.toLocaleString();
  document.getElementById('count-bytes').textContent = bytes.toLocaleString();
  document.getElementById('count-lines').textContent = lines.toLocaleString();
  document.getElementById('count-words').textContent = words.toLocaleString();
}

textarea.addEventListener('input', update);
update();
</script>
</body>
