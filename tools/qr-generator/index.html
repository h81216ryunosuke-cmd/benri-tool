<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード生成 | べんりツール</title>
<meta name="description" content="URLやテキストを入力するだけで、その場でQRコードを作成・ダウンロードできる無料ツールです。">
<link rel="canonical" href="https://example.com/tools/qr-generator/">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "QRコード生成",
  "url": "https://example.com/tools/qr-generator/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "ホーム", "item": "https://example.com/"},
    {"@type": "ListItem", "position": 2, "name": "ツール一覧", "item": "https://example.com/tools/"},
    {"@type": "ListItem", "position": 3, "name": "QRコード生成", "item": "https://example.com/tools/qr-generator/"}
  ]
}
</script>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="/">べんりツール</a>
    <nav class="site-header__nav">
      <a href="/tools/">ツール一覧</a>
      <a href="/about.html">このサイトについて</a>
      <a href="/contact.html">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>
  <p class="breadcrumb"><a href="/">ホーム</a> &gt; <a href="/tools/">ツール一覧</a> &gt; QRコード生成</p>
  <h1>QRコード生成</h1>
  <p class="lead">URLやテキストを入力すると、その場でQRコードを作成できます。</p>

  <div class="card">
    <div class="field">
      <label for="qr-text">URLまたはテキスト</label>
      <textarea id="qr-text" placeholder="例：https://example.com"></textarea>
    </div>
    <button type="button" class="btn" id="qr-generate-btn">QRコードを作成</button>
    <div id="qr-result" class="result-box is-empty">結果はここに表示されます</div>
  </div>

  <div class="ad-slot">広告枠（AdSense承認後に設置）</div>

  <p class="note-box">このツールは入力したテキストをQRコード画像に変換するため、外部API「QR Server API」（https://goqr.me/api/）へ送信します。機密情報の入力はお控えください。</p>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>&copy; 2026 べんりツール</span>
    <div class="site-footer__links">
      <a href="/about.html">このサイトについて</a>
      <a href="/privacy.html">プライバシーポリシー</a>
      <a href="/contact.html">お問い合わせ</a>
    </div>
  </div>
</footer>

<script>
document.getElementById('qr-generate-btn').addEventListener('click', function () {
  var resultBox = document.getElementById('qr-result');
  var text = document.getElementById('qr-text').value.trim();

  if (!text) {
    resultBox.className = 'result-box';
    resultBox.innerHTML = '<span class="error-text">URLまたはテキストを入力してください</span>';
    return;
  }

  var url = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(text);
  resultBox.className = 'result-box';
  resultBox.innerHTML =
    '<img src="' + url + '" alt="生成されたQRコード" width="300" height="300" style="display:block; margin-bottom:12px; border-radius:8px">' +
    '<a class="btn" href="' + url + '" download="qrcode.png" target="_blank" rel="noopener">画像をダウンロード</a>';
});
</script>
</body>
</html>
