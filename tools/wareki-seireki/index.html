<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西暦⇔和暦変換 | べんりツール</title>
<meta name="description" content="西暦から和暦（明治・大正・昭和・平成・令和）、和暦から西暦への変換が無料で簡単にできます。">
<link rel="canonical" href="https://example.com/tools/wareki-seireki/">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "西暦⇔和暦変換",
  "url": "https://example.com/tools/wareki-seireki/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": {"@type": "Offer", "price": "0", "priceCurrency": "JPY"}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "ホーム", "item": "https://example.com/"},
    {"@type": "ListItem", "position": 2, "name": "ツール一覧", "item": "https://example.com/tools/"},
    {"@type": "ListItem", "position": 3, "name": "西暦⇔和暦変換", "item": "https://example.com/tools/wareki-seireki/"}
  ]
}
</script>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="/">べんりツール</a>
    <nav class="site-header__nav">
      <a href="/tools/">ツール一覧</a>
      <a href="/about.html">このサイトについて</a>
      <a href="/contact.html">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>
  <p class="breadcrumb"><a href="/">ホーム</a> &gt; <a href="/tools/">ツール一覧</a> &gt; 西暦⇔和暦変換</p>
  <h1>西暦⇔和暦変換</h1>
  <p class="lead">明治・大正・昭和・平成・令和と西暦を相互に変換します。</p>

  <div class="card">
    <h2 style="margin-top:0">西暦→和暦</h2>
    <div class="field">
      <label for="seireki-date">日付（西暦）</label>
      <input type="date" id="seireki-date">
    </div>
    <button type="button" class="btn" id="to-wareki-btn">和暦に変換</button>
    <div id="wareki-result" class="result-box is-empty">結果はここに表示されます</div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2 style="margin-top:0">和暦→西暦</h2>
    <div class="field">
      <label for="era-select">元号</label>
      <select id="era-select">
        <option value="令和">令和</option>
        <option value="平成">平成</option>
        <option value="昭和">昭和</option>
        <option value="大正">大正</option>
        <option value="明治">明治</option>
      </select>
    </div>
    <div class="field">
      <label for="era-year">年</label>
      <input type="number" id="era-year" min="1" max="99" placeholder="例：6">
    </div>
    <button type="button" class="btn" id="to-seireki-btn">西暦に変換</button>
    <div id="seireki-result" class="result-box is-empty">結果はここに表示されます</div>
  </div>

  <div class="ad-slot">広告枠（AdSense承認後に設置）</div>

  <p class="note-box">明治は旧暦からの移行期にあたるため、明治元年〜5年頃の変換は目安としてご利用ください。大正以降は改元日を基準に正確に判定しています。</p>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>&copy; 2026 べんりツール</span>
    <div class="site-footer__links">
      <a href="/about.html">このサイトについて</a>
      <a href="/privacy.html">プライバシーポリシー</a>
      <a href="/contact.html">お問い合わせ</a>
    </div>
  </div>
</footer>

<script>
var ERAS = [
  { name: '令和', start: new Date(2019, 4, 1) },
  { name: '平成', start: new Date(1989, 0, 8) },
  { name: '昭和', start: new Date(1926, 11, 25) },
  { name: '大正', start: new Date(1912, 6, 30) },
  { name: '明治', start: new Date(1868, 0, 25) }
];

document.getElementById('to-wareki-btn').addEventListener('click', function () {
  var resultBox = document.getElementById('wareki-result');
  var val = document.getElementById('seireki-date').value;
  if (!val) {
    resultBox.className = 'result-box';
    resultBox.innerHTML = '<span class="error-text">日付を入力してください</span>';
    return;
  }
  var parts = val.split('-').map(Number);
  var d = new Date(parts[0], parts[1] - 1, parts[2]);

  var era = ERAS.find(function (e) { return d >= e.start; });
  if (!era) {
    resultBox.className = 'result-box';
    resultBox.innerHTML = '<span class="error-text">明治より前の日付には対応していません</span>';
    return;
  }
  var warekiYear = d.getFullYear() - era.start.getFullYear() + 1;
  var yearLabel = warekiYear === 1 ? '元年' : warekiYear + '年';
  resultBox.className = 'result-box';
  resultBox.innerHTML = '<div class="big">' + era.name + yearLabel + '</div>' +
    '<span>（西暦' + d.getFullYear() + '年）</span>';
});

document.getElementById('to-seireki-btn').addEventListener('click', function () {
  var resultBox = document.getElementById('seireki-result');
  var eraName = document.getElementById('era-select').value;
  var warekiYear = parseInt(document.getElementById('era-year').value, 10);

  if (!warekiYear || warekiYear < 1) {
    resultBox.className = 'result-box';
    resultBox.innerHTML = '<span class="error-text">年を正しく入力してください</span>';
    return;
  }

  var era = ERAS.find(function (e) { return e.name === eraName; });
  var seirekiYear = era.start.getFullYear() + warekiYear - 1;
  resultBox.className = 'result-box';
  resultBox.innerHTML = '<div class="big">西暦' + seirekiYear + '年</div>';
});
</script>
</body>
</html>
